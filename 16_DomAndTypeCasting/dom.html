<!DOCTYPE html>
<html lang="en">
<head>

    <script type="module"  src="./script/dom.js"></script>
</head>
<body>
    <h1>Dom with TypeScript</h1>
    <a href="/home">go to home</a>
    <h2 class="Name_Heading">My Name is Sujit Tomar</h2>

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name" value="Sujit Tomar"><br>

    </form>
